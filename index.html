function card(p){return `<article class="product-card" onclick="go('product', '${p.id}')"><div class="product-img"><img src="${p.img}" alt="${p.name}" loading="lazy"><div class="product-overlay"></div><span class="product-name">${p.name}</span><span class="product-arrow">←</span></div><div class="product-copy"><b>${p.name}</b><p>${p.desc}</p></div></article>`}
function productsSection(limit=false){return `<section id="products"><div class="container"><div class="section-head"><div><h2>منتجاتنا</h2><p>مجموعة متنوعة من الستائر تناسب جميع الأذواق والاحتياجات.</p></div><button class="link-btn" onclick="go('products')">عرض جميع المنتجات ←</button></div><div class="products-grid">${products.slice(0,limit?7:products.length).map(card).join('')}</div></div></section>`}
function why(){return `<section class="why"><div class="container why-grid"><div><h2>ليه تختار الفاطمية؟</h2><p>نهتم بالتفاصيل الصغيرة ونختار الخامات بعناية لنقدم حلول ستائر تجمع بين الجودة والتصميم العصري والتنفيذ الاحترافي.</p><button class="btn-gold" onclick="go('about')">اعرف المزيد</button></div><div class="features"><div class="feature"><div class="feature-icon">◈</div><h3>ضمان سنة</h3><p>على جميع المنتجات</p></div><div class="feature"><div class="feature-icon">◇</div><h3>خامات عالية الجودة</h3><p>منتجات مختارة بعناية</p></div><div class="feature"><div class="feature-icon">⌁</div><h3>تركيب احترافي</h3><p>على يد أفضل الفنيين</p></div><div class="feature"><div class="feature-icon">♧</div><h3>خدمة ما بعد البيع</h3><p>دعم دائم لعملائنا</p></div></div></div></section>`}
function projects(){return `<section><div class="container"><div class="section-head"><div><h2>أعمالنا السابقة</h2><p>بعض من مشاريعنا التي نفخر بها.</p></div><button class="link-btn" onclick="go('projects')">عرض المزيد ←</button></div><div class="gallery">${gallery.slice(0,4).map((x,i)=>`<div class="gallery-card"><img src="${x}" alt="مشروع ${i+1}" loading="lazy"><span>مشروع الفاطمية</span></div>`).join('')}</div></div></section>`}
function aboutSection(full=false){return `<section class="about"><div class="container about-grid"><div class="about-img"><img src="https://images.unsplash.com/photo-1757924461488-ef9ad0670978?w=1000&h=750&fit=crop&auto=format" alt="الفاطمية" loading="lazy"></div><div><div class="eyebrow">قصتنا</div><h2>من نحن</h2><p>شركة الفاطمية واحدة من الشركات المتخصصة في مجال الستائر، ونقدم مجموعة متنوعة من الحلول التي تجمع بين الجودة واللمسات العصرية. نهتم باختيار الخامات وتنفيذ الأعمال بسرعة واحترافية لتناسب مختلف الأذواق والمساحات.</p><div class="stats"><div class="stat"><strong>خبرة</strong><span>في مجال الستائر</span></div><div class="stat"><strong>جودة</strong><span>خامات مختارة</span></div><div class="stat"><strong>احترافية</strong><span>تنفيذ وتركيب</span></div></div>${!full?'<button class="btn-gold" style="margin-top:22px" onclick="go(\'about\')">اعرف المزيد</button>':''}</div></div></section>`}
function quote(){return `<section class="quote"><div class="container"><div class="quote-grid"><div class="quote-image"><div class="quote-copy"><h2>هل تحتاج إلى استشارة أو عرض سعر؟</h2><p>تواصل معنا وسنساعدك في اختيار أفضل حل لمساحتك.</p><a class="wa-btn" href="https://wa.me/${phone}" target="_blank">◉ تواصل معنا عبر واتساب</a></div></div><div class="form-wrap"><h2>اطلب عرض سعر</h2><p>املأ البيانات وسنتواصل معك في أقرب وقت.</p><form class="form" onsubmit="submitQuote(event)"><input id="name" required placeholder="الاسم بالكامل"><input id="mobile" required placeholder="رقم الموبايل" type="tel"><select id="product"><option value="">اختر المنتج</option>${products.map(p=>`<option>${p.name}</option>`).join('')}</select><textarea id="message" placeholder="رسالتك (اختياري)"></textarea><button class="submit">إرسال الطلب ←</button><div class="success" id="success">تم تجهيز الطلب، هيفتح واتساب لإرسال التفاصيل.</div></form></div></div></div></section>`}
function footer(){return `<footer class="footer"><div class="container"><div class="footer-grid"><div>${logo()}<p>شركة متخصصة في توريد وتركيب جميع أنواع الستائر، بخامات مميزة وتنفيذ احترافي.</p></div><div><h3>روابط سريعة</h3><p><a href="#" onclick="go('home');return false">الرئيسية</a><br><a href="#" onclick="go('products');return false">المنتجات</a><br><a href="#" onclick="go('about');return false">من نحن</a><br><a href="#" onclick="go('projects');return false">أعمالنا</a></p></div><div><h3>منتجاتنا</h3><p>${products.slice(0,6).map(p=>`<a href="#" onclick="go('product','${p.id}');return false">${p.name}</a><br>`).join('')}</p></div><div><h3>تواصل معنا</h3><p><a href="tel:+201096971297">01096971297</a><br><a href="tel:+201270798794">01270798794</a><br><a href="mailto:info@elfatimia.com">info@elfatimia.com</a><br>حلمية الزيتون — القاهرة</p></div></div><div class="footer-bottom"><span>© 2026 الفاطمية — جميع الحقوق محفوظة</span><span>تصميم حديث ومتجاوب</span></div></div></footer>`}
function home(){return `<div class="hero"><div class="hero-bg"></div><div class="container hero-content"><div class="eyebrow">تصميمات عصرية لحياة أفضل</div><h1>ستائر تضيف لمسة جمالية لكل مساحة</h1><p>جودة عالية • خامات مميزة • تركيب احترافي</p><div class="hero-buttons"><button class="btn-gold" onclick="go('contact')">اطلب عرض سعر</button><button class="btn-outline" onclick="go('products')">تصفح منتجاتنا</button></div></div><div class="hero-dots"><i class="active"></i><i></i><i></i></div></div>${productsSection(true)}${why()}${projects()}${aboutSection()}${quote()}`}
function page(title,desc,content){return `<div class="page-hero"><div class="container"><div class="eyebrow">الفاطمية</div><h1>${title}</h1><p>${desc||''}</p></div></div>${content}`}
function productPage(id){const p=products.find(x=>x.id===id)||products[0];const related=products.filter(x=>x.id!==p.id).slice(0,4);return `<div class="product-detail"><div class="container"><div class="detail-grid"><div class="detail-main-img"><img src="${p.img}" alt="${p.name}"></div><div class="detail-info"><div class="eyebrow">منتجات الفاطمية</div><h1>${p.name}</h1><p>${p.desc}</p><div class="checks">${p.features.map(x=>`<div class="check">✓ ${x}</div>`).join('')}</div><button class="btn-gold" onclick="go('contact')">اطلب عرض سعر</button></div></div><div class="detail-features"><div class="section-head"><div><h2>مميزات المنتج</h2><p>تفاصيل مختارة تساعدك في اختيار الحل المناسب.</p></div></div><div class="feature-cards">${p.features.map((x,i)=>`<div class="fc"><div class="feature-icon">${['◈','◇','◉','◆'][i%4]}</div><h3>${x}</h3><p>خيار عملي وأنيق يناسب احتياجات المساحة.</p></div>`).join('')}</div></div><div style="margin-top:60px"><div class="section-head"><div><h2>معرض صور المنتج</h2></div></div><div class="detail-gallery">${[p.img,...gallery.slice(0,3)].map(x=>`<img src="${x}" alt="${p.name}" loading="lazy">`).join('')}</div></div><div style="margin-top:60px"><div class="section-head"><div><h2>منتجات مشابهة</h2></div></div><div class="products-grid">${related.map(card).join('')}</div></div></div></div>`}
function render(){const hash=decodeURIComponent(location.hash.replace(/^#/,'')||'home');let html='';let active=hash.split('/')[0];if(active==='home')html=home();else if(active==='products')html=page('منتجاتنا','مجموعة متنوعة من الستائر تناسب جميع الأذواق والاحتياجات.',`<section>${`<div class="container"><div class="products-grid">${products.map(card).join('')}</div></div>`}</section>`);else if(active==='product')html=productPage(hash.split('/')[1]);else if(active==='about')html=page('من نحن','قصتنا وخبرتنا في مجال الستائر.',aboutSection(true));else if(active==='projects')html=page('أعمالنا السابقة','نماذج من المشاريع التي نفخر بتنفيذها.',`<section><div class="container"><div class="gallery">${gallery.map((x,i)=>`<div class="gallery-card"><img src="${x}" alt="مشروع ${i+1}" loading="lazy"><span>مشروع الفاطمية</span></div>`).join('')}</div></div></section>`);else if(active==='contact')html=page('اطلب عرض سعر','فريقنا جاهز للمساعدة في اختيار أفضل حل لمساحتك.',quote());else html=home();document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===active));window.scrollTo({top:0,behavior:'instant'})}
function go(page,id){location.hash=id?`${page}/${id}`:page;render();closeDrawer()}
function openDrawer(){document.getElementById('drawer').classList.add('show')}function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
async function submitQuote(e){e.preventDefault();const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),product=document.getElementById('product').value||'غير محدد',message=document.getElementById('message').value.trim()||'لا توجد رسالة';if(window.supabaseClient){try{await window.supabaseClient.from('leads').insert({name,phone:mobile,product,message,status:'new',source:'website'})}catch(err){console.warn('Lead save failed',err)}}const text=`طلب عرض سعر من موقع الفاطمية\nالاسم: ${name}\nالموبايل: ${mobile}\nالمنتج: ${product}\nالرسالة: ${message}`;document.getElementById('success').style.display='block';window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener,noreferrer')}
async function loadRemoteData(){if(!window.supabaseClient)return;try{const [{data:ps},{data:gs},{data:ss},{data:seo}]=await Promise.all([window.supabaseClient.from('products').select('*').eq('active',true).order('sort_order'),window.supabaseClient.from('projects').select('*').eq('active',true).order('sort_order'),window.supabaseClient.from('site_settings').select('key,value'),window.supabaseClient.from('seo_pages').select('*')]);if(ps&&ps.length)products=ps.map(p=>({id:p.slug,name:p.name,img:p.image_url,desc:p.description||'',features:p.features||[]}));if(gs&&gs.length)gallery=gs.map(g=>g.image_url);if(ss&&ss.length){const m=Object.fromEntries(ss.map(x=>[x.key,x.value]));if(m.phone)phone=m.phone;if(m.site_title)document.title=m.site_title;if(m.meta_description){let d=document.querySelector('meta[name=description]');if(d)d.content=m.meta_description}}if(seo&&seo.length){const path=location.hash.replace(/^#/,'').split('/')[0]||'home';const row=seo.find(x=>x.slug===path);if(row){document.title=row.title||document.title;let d=document.querySelector('meta[name=description]');if(d&&row.meta_description)d.content=row.meta_description}}render()}catch(err){console.warn('Remote data unavailable; using built-in content.',err)}}
window.addEventListener('hashchange',()=>{render();loadRemoteData()});initNav();render();loadRemoteData();
</script>
</body>
</html>
