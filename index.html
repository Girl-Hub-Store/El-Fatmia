<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="الفاطمية للستائر - تصميم وتنفيذ الستائر والديكورات الداخلية" />
  <title>الفاطمية للستائر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root{--deep-teal:#0F303A;--deep-teal-light:#1a4a57;--deep-teal-lighter:#255e6e;--ivory:#F7F5EF;--ivory-dark:#ede9df;--champagne:#D4AF7C;--champagne-dark:#b8924a;--champagne-light:#e8c99a;--charcoal:#2E2E2E;--charcoal-light:#555}
    html{font-family:'Cairo',sans-serif;direction:rtl;scroll-behavior:smooth}
    body{margin:0;background:#F7F5EF;color:#2E2E2E;font-family:'Cairo',sans-serif}
    *,button,a,input,textarea,select{font-family:'Cairo',sans-serif}
    .carousel-scroll{scrollbar-width:none;-ms-overflow-style:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .carousel-scroll::-webkit-scrollbar{display:none}
    .header-blur{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    button,a{transition:all .2s ease}
    input:focus,textarea:focus,select:focus{outline:none}
    .accordion-content{overflow:hidden;transition:max-height .3s ease}
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
