<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Fatimia — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--teal:#0f303a;--teal2:#1a4a57;--gold:#d4af7c;--bg:#f5f4ef;--card:#fff;--ink:#273238;--muted:#728085;--line:#e5e1d8;--danger:#b42318;--green:#17834d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;padding:34px;border-radius:25px;box-shadow:0 20px 60px #0f303a18}.brand{color:var(--teal);font-size:26px;font-weight:900;margin-bottom:6px}.sub{color:var(--muted);font-size:13px;margin-bottom:25px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:var(--teal)}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d4af7c22}.btn{border:0;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.gold{background:var(--gold);color:var(--teal)}.ghost{background:#eef1f0;color:var(--teal)}.danger{background:#fff0ee;color:var(--danger)}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--teal);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.side h1{font-size:22px;margin:0 8px}.side small{opacity:.6}.nav{margin-top:28px;display:grid;gap:5px}.nav button{background:transparent;color:#dfe7e8;border:0;text-align:right;padding:12px 13px;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff14;color:#fff}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h2{margin:0;color:var(--teal)}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat-card b{font-size:28px;color:var(--teal);display:block}.stat-card span{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h3{margin:0;color:var(--teal)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}.table th{color:var(--muted);font-size:11px}.thumb{width:58px;height:44px;object-fit:cover;border-radius:8px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef1f0;color:var(--teal);font-size:10px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal{position:fixed;inset:0;background:#0f303a80;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;color:var(--teal)}.feature-row{display:flex;gap:7px;margin:7px 0}.feature-row input{flex:1}.notice{padding:10px 12px;border-radius:10px;background:#f4f7f7;color:var(--muted);font-size:12px;margin:10px 0}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:16px}.cards{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand">الفاطمية — لوحة التحكم</div><div class="sub">سجّل الدخول لإدارة الموقع والطلبات وSEO.</div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">دخول</button><div id="loginMsg" class="notice hidden"></div></div></div>
<div id="app" class="hidden"><div class="shell"><aside class="side"><h1>الفاطمية</h1><small>CMS Dashboard</small><div class="nav"><button data-tab="dashboard" onclick="showTab('dashboard')">الرئيسية</button><button data-tab="products" onclick="showTab('products')">المنتجات</button><button data-tab="projects" onclick="showTab('projects')">المشاريع</button><button data-tab="leads" onclick="showTab('leads')">الطلبات</button><button data-tab="seo" onclick="showTab('seo')">SEO</button><button data-tab="settings" onclick="showTab('settings')">الإعدادات</button></div><button class="btn ghost" style="width:100%;margin-top:25px" onclick="logout()">تسجيل الخروج</button></aside><main class="main"><div id="content"></div></main></div></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script>
const sb=window.supabaseClient;let tab='dashboard';let products=[],projects=[],leads=[],settings=[],seo=[];
function requireSB(){if(!sb){alert('أولاً ضع Supabase URL و anon key في config.js');return false}return true}
async function login(){if(!requireSB())return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){const m=document.getElementById('loginMsg');m.textContent=error.message;m.classList.remove('hidden');return}boot()}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
async function boot(){if(!requireSB())return;const {data}=await sb.auth.getSession();if(!data.session){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await refresh();showTab('dashboard')}
async function refresh(){if(!sb)return;const [p,pr,l,s,se]=await Promise.all([sb.from('products').select('*').order('sort_order'),sb.from('projects').select('*').order('sort_order'),sb.from('leads').select('*').order('created_at',{ascending:false}),sb.from('site_settings').select('*').order('key'),sb.from('seo_pages').select('*').order('slug')]);products=p.data||[];projects=pr.data||[];leads=l.data||[];settings=s.data||[];seo=se.data||[]}
function showTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));const fn={dashboard:dashboard,products:productsView,projects:projectsView,leads:leadsView,seo:seoView,settings:settingsView}[t];document.getElementById('content').innerHTML=fn()}
function head(title,actions=''){return `<div class="top"><h2>${title}</h2><div class="actions">${actions}</div></div>`}
function dashboard(){return head('لوحة التحكم',`<button class="btn primary" onclick="refresh().then(()=>showTab('dashboard'))">تحديث</button><a class="btn ghost" href="index.html" target="_blank">فتح الموقع</a>`)+`<div class="cards"><div class="stat-card"><b>${products.length}</b><span>إجمالي المنتجات</span></div><div class="stat-card"><b>${projects.length}</b><span>المشاريع</span></div><div class="stat-card"><b>${leads.filter(x=>x.status==='new').length}</b><span>طلبات جديدة</span></div><div class="stat-card"><b>${leads.length}</b><span>إجمالي الطلبات</span></div></div><div class="panel"><div class="panel-head"><h3>آخر الطلبات</h3><button class="btn ghost" onclick="showTab('leads')">كل الطلبات</button></div>${leadTable(leads.slice(0,6))}</div>`}
function leadTable(rows){if(!rows.length)return '<div class="empty">لا توجد طلبات حتى الآن.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>العميل</th><th>الهاتف</th><th>المنتج</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td>${esc(x.product||'-')}</td><td><select onchange="updateLead('${x.id}',this.value)">${['new','contacted','follow_up','won','closed'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></td><td>${new Date(x.created_at).toLocaleDateString('ar-EG')}</td><td><button class="btn ghost" onclick='viewLead(${JSON.stringify(x)})'>عرض</button></td></tr>`).join('')}</tbody></table></div>`}
function productsView(){return head('المنتجات',`<button class="btn primary" onclick="productModal()">+ إضافة منتج</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>صورة</th><th>المنتج</th><th>Slug</th><th>الحالة</th><th>ترتيب</th><th></th></tr></thead><tbody>${products.map(x=>`<tr><td><img class="thumb" src="${esc(x.image_url)}"></td><td><b>${esc(x.name)}</b><br><small>${esc(x.description||'')}</small></td><td>${esc(x.slug)}</td><td><span class="badge">${x.active?'ظاهر':'مخفي'}</span></td><td>${x.sort_order}</td><td><button class="btn ghost" onclick='productModal(${JSON.stringify(x)})'>تعديل</button> <button class="btn danger" onclick="deleteProduct('${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`}
function projectsView(){return head('المشاريع',`<button class="btn primary" onclick="projectModal()">+ إضافة مشروع</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>صورة</th><th>العنوان</th><th>الحالة</th><th>ترتيب</th><th></th></tr></thead><tbody>${projects.map(x=>`<tr><td><img class="thumb" src="${esc(x.image_url)}"></td><td>${esc(x.title)}</td><td><span class="badge">${x.active?'ظاهر':'مخفي'}</span></td><td>${x.sort_order}</td><td><button class="btn ghost" onclick='projectModal(${JSON.stringify(x)})'>تعديل</button> <button class="btn danger" onclick="deleteProject('${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`}
function leadsView(){return head('طلبات عروض الأسعار',`<button class="btn primary" onclick="refresh().then(()=>showTab('leads'))">تحديث</button>`)+`<div class="panel">${leadTable(leads)}</div>`}
function seoView(){return head('SEO',`<button class="btn primary" onclick="seoModal()">+ صفحة SEO</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Slug</th><th>Title</th><th>Meta Description</th><th>Canonical</th><th></th></tr></thead><tbody>${seo.map(x=>`<tr><td>${esc(x.slug)}</td><td>${esc(x.title)}</td><td>${esc(x.meta_description||'')}</td><td>${esc(x.canonical_url||'-')}</td><td><button class="btn ghost" onclick='seoModal(${JSON.stringify(x)})'>تعديل</button></td></tr>`).join('')}</tbody></table></div></div>`}
function settingsView(){const m=Object.fromEntries(settings.map(x=>[x.key,x.value]));return head('إعدادات الموقع',`<button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button>`)+`<div class="panel"><div class="grid2"><div class="field"><label>رقم واتساب/هاتف</label><input id="set_phone" value="${esc(m.phone||'201096971297')}"></div><div class="field"><label>عنوان الموقع</label><input id="set_title" value="${esc(m.site_title||'الفاطمية للستائر | EL FATIMIA')}"></div><div class="field" style="grid-column:1/-1"><label>Meta Description</label><textarea id="set_desc">${esc(m.meta_description||'')}</textarea></div></div></div><div class="panel"><h3>Google Analytics / Ads</h3><p class="sub">ضع المعرفات في <b>config.js</b> داخل المشروع. لا تضع Service Role Key في الموقع.</p></div>`}
function productModal(x={}){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><h3>${x.id?'تعديل منتج':'إضافة منتج'}</h3><button class="btn ghost" onclick="closeModal()">×</button></div><div class="field"><label>اسم المنتج</label><input id="p_name" value="${esc(x.name||'')}"></div><div class="field"><label>Slug</label><input id="p_slug" value="${esc(x.slug||'')}"></div><div class="field"><label>الوصف</label><textarea id="p_desc">${esc(x.description||'')}</textarea></div><div class="field"><label>رابط الصورة</label><input id="p_img" value="${esc(x.image_url||'')}"></div><div class="field"><label>المميزات — كل ميزة في سطر</label><textarea id="p_features">${esc((x.features||[]).join('\n'))}</textarea></div><div class="grid2"><div class="field"><label>الترتيب</label><input id="p_order" type="number" value="${x.sort_order??0}"></div><div class="field"><label>الحالة</label><select id="p_active"><option value="true" ${x.active!==false?'selected':''}>ظاهر</option><option value="false" ${x.active===false?'selected':''}>مخفي</option></select></div></div><div class="actions"><button class="btn primary" onclick='saveProduct(${JSON.stringify(x.id||'')})'>حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`;openModal()}
async function saveProduct(id){const obj={name:v('p_name'),slug:v('p_slug')||slugify(v('p_name')),description:v('p_desc'),image_url:v('p_img'),features:v('p_features').split('\n').map(x=>x.trim()).filter(Boolean),sort_order:+v('p_order')||0,active:v('p_active')==='true'};const q=id?sb.from('products').update(obj).eq('id',id):sb.from('products').insert(obj);const {error}=await q;if(error)return alert(error.message);closeModal();await refresh();showTab('products')}
async function deleteProduct(id){if(!confirm('حذف المنتج؟'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);await refresh();showTab('products')}
function projectModal(x={}){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><h3>${x.id?'تعديل مشروع':'إضافة مشروع'}</h3><button class="btn ghost" onclick="closeModal()">×</button></div><div class="field"><label>العنوان</label><input id="g_title" value="${esc(x.title||'مشروع الفاطمية')}"></div><div class="field"><label>رابط الصورة</label><input id="g_img" value="${esc(x.image_url||'')}"></div><div class="field"><label>الوصف</label><textarea id="g_desc">${esc(x.description||'')}</textarea></div><div class="grid2"><div class="field"><label>الترتيب</label><input id="g_order" type="number" value="${x.sort_order??0}"></div><div class="field"><label>الحالة</label><select id="g_active"><option value="true" ${x.active!==false?'selected':''}>ظاهر</option><option value="false" ${x.active===false?'selected':''}>مخفي</option></select></div></div><div class="actions"><button class="btn primary" onclick='saveProject(${JSON.stringify(x.id||'')})'>حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`;openModal()}
async function saveProject(id){const obj={title:v('g_title'),image_url:v('g_img'),description:v('g_desc'),sort_order:+v('g_order')||0,active:v('g_active')==='true'};const q=id?sb.from('projects').update(obj).eq('id',id):sb.from('projects').insert(obj);const {error}=await q;if(error)return alert(error.message);closeModal();await refresh();showTab('projects')}
async function deleteProject(id){if(!confirm('حذف المشروع؟'))return;const {error}=await sb.from('projects').delete().eq('id',id);if(error)alert(error.message);await refresh();showTab('projects')}
function seoModal(x={}){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><h3>${x.id?'تعديل SEO':'إضافة SEO'}</h3><button class="btn ghost" onclick="closeModal()">×</button></div><div class="field"><label>Slug</label><input id="s_slug" value="${esc(x.slug||'')}"></div><div class="field"><label>Page Title</label><input id="s_title" value="${esc(x.title||'')}"></div><div class="field"><label>Meta Description</label><textarea id="s_desc">${esc(x.meta_description||'')}</textarea></div><div class="field"><label>Canonical URL</label><input id="s_can" value="${esc(x.canonical_url||'')}"></div><div class="field"><label>Open Graph Image</label><input id="s_og" value="${esc(x.og_image||'')}"></div><div class="field"><label>Robots</label><input id="s_robots" value="${esc(x.robots||'index,follow')}"></div><div class="actions"><button class="btn primary" onclick='saveSEO(${JSON.stringify(x.id||'')})'>حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`;openModal()}
async function saveSEO(id){const obj={slug:v('s_slug'),title:v('s_title'),meta_description:v('s_desc'),canonical_url:v('s_can'),og_image:v('s_og'),robots:v('s_robots')};const q=id?sb.from('seo_pages').update(obj).eq('id',id):sb.from('seo_pages').insert(obj);const {error}=await q;if(error)alert(error.message);else{closeModal();await refresh();showTab('seo')}}
async function saveSettings(){const vals={phone:v('set_phone'),site_title:v('set_title'),meta_description:v('set_desc')};for(const [key,value] of Object.entries(vals)){const {error}=await sb.from('site_settings').upsert({key,value,updated_at:new Date().toISOString()});if(error)return alert(error.message)}alert('تم حفظ الإعدادات')}
async function updateLead(id,status){const {error}=await sb.from('leads').update({status}).eq('id',id);if(error)alert(error.message);else await refresh()}
function viewLead(x){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><h3>تفاصيل الطلب</h3><button class="btn ghost" onclick="closeModal()">×</button></div><p><b>الاسم:</b> ${esc(x.name)}</p><p><b>الهاتف:</b> <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p><p><b>المنتج:</b> ${esc(x.product||'-')}</p><p><b>الرسالة:</b> ${esc(x.message||'-')}</p><p><b>المصدر:</b> ${esc(x.source||'-')}</p><p><b>التاريخ:</b> ${new Date(x.created_at).toLocaleString('ar-EG')}</p>`;openModal()}
function statusLabel(s){return {new:'جديد',contacted:'تم التواصل',follow_up:'متابعة',won:'تم الاتفاق',closed:'مغلق'}[s]||s}function openModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function v(id){return document.getElementById(id)?.value?.trim()||''}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function slugify(s){return s.toString().trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-').replace(/^-+|-+$/g,'')}
boot();
</script></body></html>
